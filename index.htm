<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Drill 2</title>
</head>
<body class="text-dark bg-light">
    <form class="container py-3 mt-3 col-md-6 text-dark bg-light">
        <input type="number" id="num1" placeholder="First Digit">
        <input type="number" id="num2" placeholder="Second Digit">
        <button class="btn btn-primary" type="button" py-click="addition">Add</button>
        <button class="btn btn-primary" type="button" py-click="subtraction">Subtract</button>
        <button class="btn btn-primary" type="button" py-click="multiply">Multiply</button>
        <button class="btn btn-primary" type="button" py-click="divide">Divide</button>
        <button class="btn btn-primary" type="button" py-click="modulate">Find remainder</button>
        <button class="btn btn-primary" type="button" py-click="exponent">Exponentiate</button>
        <button class="btn btn-primary" type="button" py-click="floor">Divide and round off</button>
    </form>
    <div class="container py-3 mt-3 col-md-6 text-dark bg-light" id="result">

    </div>
    <py-script src="main.py"></py-script>
    <script src="main.js"></script>
</body>
</html>
